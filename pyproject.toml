[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defector-api"
version = "0.1.0"
description = "Automated visual quality control for machine parts using unsupervised anomaly detection (PatchCore, MVTec AD)"
readme = "README.md"
license = { text = "GPL-2.0-only" }
authors = [{ name = "Faris Skopak", email = "faris.skopak87@gmail.com" }]

# Upstream anomalib declares support up to 3.12; this project runs on the
# system 3.14 by choice. Kept open so pip does not block that.
requires-python = ">=3.12"

dependencies = [
    # Model and data
    "anomalib==2.7.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    # Web layer
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    # Database
    "sqlmodel==0.0.48",
    "sqlalchemy>=2.1",
    # Configuration and classifier serialization
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "joblib>=1.6",
    # Imported directly by src or scripts. They arrive transitively today and
    # are listed so a change upstream cannot remove them.
    "numpy>=2.5",
    "pillow>=13.0",
    "scikit-learn>=1.9",
    "rich>=15.0",
]

[project.optional-dependencies]
# httpx2 is what starlette's TestClient expects; httpx is deprecated there.
dev = ["ruff>=0.17", "pytest>=9.1", "httpx2>=2.16"]

[project.urls]
Repository = "https://github.com/R3FA/defector-api"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
